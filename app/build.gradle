plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.dagger.hilt.android'
}

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.zynksoftware.base"
        minSdk 23
        targetSdk 33
        versionCode 7
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField 'String', 'SERVER_URL', '"http://192.168.199.218:8080/"'

        buildConfigField 'String', 'CREDENTIALS_USERNAME', '"GUILDA_CLIENT"'   //TODO - add credentials for basic auth
        buildConfigField 'String', 'CREDENTIALS_PASSWORD', '"SECRET"'  //TODO - add credentials for basic auth
    }

    buildFeatures {
        viewBinding true
    }

    buildFeatures {
        compose true
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [enableCrashReporting:"false"]
        }

        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [enableCrashReporting:"true"]
        }
    }

    flavorDimensions "build"
    productFlavors {
        staging {
            dimension "build"
            //TODO set different variables for different builds as needed
            buildConfigField 'String', 'SERVER_URL', '"http://192.168.199.218:8080/"'
            buildConfigField 'String', 'STAGING_SERVER_URL', '""'
            buildConfigField 'String', 'PRODUCTION_SERVER_URL', '""'
            buildConfigField 'boolean', 'SHOULD_SHOW_DEV_SCREEN', "false"
        }

        production {
            dimension "build"
            //TODO set different variables for different builds as needed
            buildConfigField 'String', 'SERVER_URL', '"http://192.168.199.218:8080/"'
            buildConfigField 'String', 'STAGING_SERVER_URL', '""'
            buildConfigField 'String', 'PRODUCTION_SERVER_URL', '""'
            buildConfigField 'boolean', 'SHOULD_SHOW_DEV_SCREEN', "false"
        }

        beta {
            dimension "build"
            //TODO set different variables for different builds as needed
            buildConfigField 'String', 'SERVER_URL', '"http://192.168.199.218:8080/"'
            buildConfigField 'String', 'STAGING_SERVER_URL', '"http://192.168.199.218:8080/"'
            buildConfigField 'String', 'PRODUCTION_SERVER_URL', '"http://192.168.199.218:8080/"'
            buildConfigField 'boolean', 'SHOULD_SHOW_DEV_SCREEN', "true"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
}

dependencies {

    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }

    implementation "androidx.compose.material:material:1.4.3"
    implementation "androidx.compose.compiler:compiler:1.4.8"
    implementation "androidx.compose.ui:ui-tooling-preview:1.4.3"
    implementation 'androidx.activity:activity-compose:1.7.2'
    debugImplementation "androidx.compose.ui:ui-tooling:1.4.3"

    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // Fragment
    implementation "androidx.fragment:fragment-ktx:1.5.5"

    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.3'

    // Material
    implementation 'com.google.android.material:material:1.7.0'

    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation platform('com.google.firebase:firebase-bom:32.0.0')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-config-ktx'

    implementation 'androidx.annotation:annotation:1.5.0'

    // Lifecycle + ViewModel & LiveData
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-reactivestreams-ktx:2.5.1'

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
    implementation("com.squareup.moshi:moshi-kotlin:1.12.0")

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    debugImplementation 'com.squareup.okhttp3:logging-interceptor:4.9.1'

    // Security SharedPreferences
    implementation 'androidx.security:security-crypto:1.0.0'

    // Hilt
    implementation "com.google.dagger:hilt-android:2.44"
    kapt "com.google.dagger:hilt-compiler:2.44"

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    implementation 'com.google.android.gms:play-services-auth:20.1.0'
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.0.1'

    // GSON
    implementation 'com.google.code.gson:gson:2.9.0'

    //Storo
    implementation('com.github.lowlevel-studios:storo:1.2.0') {
        transitive = true
    }

    //Permissions
    implementation 'com.github.fondesa:kpermissions:3.3.0'

    //Paging
    implementation("androidx.paging:paging-runtime-ktx:3.1.1")

    //LeakCanary
    //debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.8.1'

    //emulator detector
    implementation 'com.github.mofneko:EmulatorDetector:1.1.0'

    implementation "androidx.biometric:biometric:1.1.0"

    // In-App updates
    implementation 'com.google.android.play:app-update:2.0.1'
    implementation 'com.google.android.play:app-update-ktx:2.0.1'
}


// Allow references to generated code
kapt {
    correctErrorTypes true
}